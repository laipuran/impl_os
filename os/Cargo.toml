[package]
name = "impl-os"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "impl-os"
path = "src/main.rs"
test = false
bench = false

[features]
# 显式启用启动时检查；默认不得放宽用户态映射权限。
ktest = []

[dependencies]
log = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }
