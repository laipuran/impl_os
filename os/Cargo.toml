[package]
name = "impl-os"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "impl-os"
path = "src/main.rs"
test = false
bench = false

[features]
# 启用启动期内核白盒自检套件（仅用于测试，默认构建不开启）。
ktest = []

[dependencies]
buddy_system_allocator = { version = "0.11", default-features = false, features = ["use_spin"] }
log = { version = "0.4", default-features = false }
thiserror = { version = "2", default-features = false }
