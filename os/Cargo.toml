[package]
name = "impl-os"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "impl-os"
path = "src/main.rs"
test = false
bench = false

[features]
# Explicit boot-time checks; never enable permissive user mappings by default.
trap-smoke = []

[dependencies]
log = { version = "0.4", default-features = false }
